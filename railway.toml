# Servicio UNICO (fullstack) — Railway
# La API (Fastify) sirve la API REST y el frontend compilado (apps/web/dist).
# Root directory del servicio: / (monorepo compartido, npm workspaces)
# Variables: PORT (la inyecta Railway), GUARDIAN_HMAC_SECRET, CORS_ORIGIN (opcional)
#
# Build: compila el frontend a apps/web/dist, que la API expone en runtime.
# Start: levanta la API, que sirve API + web en el mismo dominio.

[build]
buildCommand = "npm run build:web"

[deploy]
startCommand = "npm run start:api"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
